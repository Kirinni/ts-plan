# 在 GitHub 的机器上编 mipsle 单二进制，打成 tar.gz + 仓库快照，发到 Release。
# 你（或 VPS）再用 server/pull-release.sh 一条命令拉下来铺到分发点 —— 全程不需要密钥。
#
#   Step 1  server/build-selfbuild.sh    编（自带 CLI 行为 / 软浮点 / 静态链接 三项断言）
#   Step 2  server/make-artifact.sh      打 tar.gz + sha256 + 生成 ts.conf.local
#   Step 3  server/make-repo-archive.sh  导出仓库快照（路由器安装时也不碰 GitHub）
#   Step 4  发 Release：固定文件名 + BUILD_INFO.txt，供 VPS/路由器匿名下载
#
# 为什么不在 CI 里 ssh 推给 VPS：那要在 GitHub 侧存一把能登你服务器的私钥，
# GitHub 侧一旦出事就是服务器级别的失守；而公开仓库的 Release 是匿名可下的，
# 让 VPS 主动拉一遍，既不用密钥也不用 scp。
#
# 怎么触发：
#   • Actions 页面手动 Run workflow —— 可填版本号 / 分发前缀 / Release 标签
#   • 推 tag：git tag v1.102.4 && git push origin v1.102.4
#     —— 版本号自动取 tag 名，编完自动发 Release
#   • 改到 server/ router/ .github/ 的 PR —— 只跑脚本检查和编译，不发 Release
#
# Secrets 一个都不用配；可选的 Variables 见 README「三 → 2.5」。
name: 构建 mipsle 单二进制

on:
  workflow_dispatch:
    inputs:
      ver:
        description: Tailscale 版本（不带 v；留空 = tag 名或 TS_VER 变量）
        type: string
        default: ""
      base_url:
        description: 分发点前缀（留空 = 用 TS_BASE_URL 变量）
        type: string
        default: ""
      release_tag:
        description: 发到哪个 Release 标签（如 v1.102.4；留空 = 只管编，不发 Release）
        type: string
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "server/**"
      - "router/**"
      - ".github/**"

# 建 Release 需要写权限，其余只读
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # 分发点前缀：手动输入 > 仓库变量 > 占位值（占位值会被 ts-doctor 警告，提醒你还没配）
  TS_BASE_URL: ${{ inputs.base_url || vars.TS_BASE_URL || 'https://dl.example.com/ts/CHANGE_ME_TOKEN' }}
  # 下面两项只用来填进 dist/ts.conf.local 和打印安装命令，非机密
  TS_LOGIN_SERVER: ${{ vars.TS_LOGIN_SERVER || 'https://hs.example.com' }}
  TS_ADVERTISE_ROUTES: ${{ vars.TS_ADVERTISE_ROUTES || '192.168.31.0/24' }}
  TS_VER: ${{ vars.TS_VER }}

jobs:
  # ---------------------------------------------------------------------------
  # 脚本语法 + 行尾：Windows 上改脚本很容易带进 CRLF，busybox ash 会当场报错
  # ---------------------------------------------------------------------------
  scripts:
    name: 脚本检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: dash -n / bash -n 全部脚本
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -n1 "$f" | grep -q bash; then shcmd=bash; else shcmd=sh; fi
            if ! "$shcmd" -n "$f"; then
              echo "::error file=$f::$shcmd -n 失败（语法错，或文件带了 CRLF）"
              fail=1
            fi
          done < <(git ls-files 'server/*.sh' 'router/*' | sort -u)
          [ "$fail" = 0 ] || exit 1
      - name: 确认脚本里没有 CRLF
        run: |
          if git grep -I -l $'\r' -- server router; then
            echo "::error::上面这些文件里混进了 CRLF —— 路由器上的 busybox ash 会报语法错（检查 .gitattributes）"
            exit 1
          fi
          echo "OK 行尾干净"

  # ---------------------------------------------------------------------------
  # 编译 → 打包 → 快照 → 上传
  # ---------------------------------------------------------------------------
  build:
    name: 编译并分发
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: scripts
    permissions:
      contents: write # 打 tag 时建 Release
    steps:
      - uses: actions/checkout@v7
        with:
          # git archive 要导出快照，拿全历史最省心（仓库很小）
          fetch-depth: 0

      # build-selfbuild.sh 自己会准备 Go（缺了就下官方 tarball 并校验 sha256），
      # 这里装一个稳定版只是省掉每次重新下载工具链的时间。
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: 确定版本号与分发前缀
        id: pick
        run: |
          set -euo pipefail
          ver="${IN_VER:-}"
          if [ -z "$ver" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ver="${GITHUB_REF_NAME}"
          fi
          [ -n "$ver" ] || ver="${TS_VER:-}"
          ver="${ver#v}"
          [ -n "$ver" ] || ver="1.102.4"
          base="${TS_BASE_URL%/}"
          ref="$GITHUB_SHA"
          # Release 标签：推 tag 时用 tag 名；手动跑就用输入（留空 = 不发 Release）
          rel=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then rel="${GITHUB_REF_NAME}"; fi
          [ -n "$rel" ] || rel="${IN_REL:-}"
          {
            echo "ver=$ver"
            echo "base=$base"
            echo "ref=$ref"
            echo "rel=$rel"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 构建 mipsle 单二进制 v$ver"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`$ver\` |"
            echo "| 分发前缀 | \`$base\` |"
            echo "| commit | \`$ref\` |"
            echo "| Release | ${rel:-（本次不发）} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IN_VER: ${{ inputs.ver }}
          IN_REL: ${{ inputs.release_tag }}

      - name: 编译（含 CLI / 软浮点 / 静态链接断言）
        env:
          VER: ${{ steps.pick.outputs.ver }}
        run: |
          set -euo pipefail
          VER="$VER" OUT="$PWD/dist" bash server/build-selfbuild.sh

      - name: 打包 + 生成 ts.conf.local
        env:
          VER: ${{ steps.pick.outputs.ver }}
        run: |
          set -euo pipefail
          SOURCE=local BINARY="dist/tailscaled_${VER}_mipsle" OUT=dist \
            BASE_URL="$TS_BASE_URL" \
            LOGIN_SERVER="$TS_LOGIN_SERVER" \
            ADVERTISE_ROUTES="$TS_ADVERTISE_ROUTES" \
            bash server/make-artifact.sh

      - name: 导出仓库快照（路由器安装时也不用访问 GitHub）
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          set -euo pipefail
          REF="$REF" OUT=dist BASE_URL="$TS_BASE_URL" bash server/make-repo-archive.sh

      - name: 汇总安装命令 + 准备 Release 资产
        id: info
        env:
          VER: ${{ steps.pick.outputs.ver }}
          REF: ${{ steps.pick.outputs.ref }}
          BASE: ${{ steps.pick.outputs.base }}
          REL: ${{ steps.pick.outputs.rel }}
        run: |
          set -euo pipefail
          tsha="$(cat "dist/tailscaled_${VER}_mipsle.tar.gz.sha256")"
          asha="$(sha256sum "dist/archive/$REF.tar.gz" | cut -d' ' -f1)"

          # 注意：这里不用 heredoc 写文件 —— YAML 块里每行都必须缩进，而 heredoc 的
          # 结束标记必须是行首，两者冲突（用 printf 最省事）
          printf '%s\n' \
            "GitHub Actions 产出的工件（Tailscale v$VER / mipsle softfloat / 单二进制自带 CLI）" \
            "" \
            "分发点里应该有的东西：" \
            "  bootstrap.sh" \
            "  ts.conf.local" \
            "  tailscaled_${VER}_mipsle.tar.gz    sha256 $tsha" \
            "  archive/$REF.tar.gz                sha256 $asha" \
            "" \
            "路由器上一条命令装完（全程不碰 GitHub）：" \
            "  wget -O- $BASE/bootstrap.sh | sh -s -- \\" \
            "    --base-url $BASE \\" \
            "    --ref $REF \\" \
            "    --sha256 $asha \\" \
            "    --artifact \"$tsha $BASE/tailscaled_${VER}_mipsle.tar.gz\" \\" \
            "    --login-server $TS_LOGIN_SERVER \\" \
            "    --routes $TS_ADVERTISE_ROUTES \\" \
            "    --authkey -" \
            "" \
            "想改配置就别传 --login-server/--routes/--authkey，改成把 ts.conf.local 拷到" \
            "/etc/tailscale/ts.conf.local（细节见 README「三、从零部署」第 6 步）。" \
            > dist/INSTALL.txt

          # ---- Release 用的固定文件名资产 -------------------------------------------------
          # 固定名字 = 下载地址永远只有一条（…/releases/latest/download/<名字>），
          # 版本号放 BUILD_INFO.txt 里，不写进文件名，省得每次改 URL。
          # 版本名的原件也一起发，方便以后回滚到某个版本。
          cp -f "dist/tailscaled_${VER}_mipsle.tar.gz"        dist/tailscaled_mipsle.tar.gz
          cp -f "dist/tailscaled_${VER}_mipsle.tar.gz.sha256" dist/tailscaled_mipsle.tar.gz.sha256
          cp -f "dist/archive/$REF.tar.gz" dist/repo-snapshot.tar.gz
          sha256sum dist/repo-snapshot.tar.gz | cut -d' ' -f1 > dist/repo-snapshot.tar.gz.sha256
          chmod 0644 dist/bootstrap.sh
          printf '%s\n' \
            "version=$VER" \
            "ref=$REF" \
            "tar=tailscaled_mipsle.tar.gz" \
            "tar_sha256=$tsha" \
            "snapshot=repo-snapshot.tar.gz" \
            "snapshot_sha256=$asha" \
            > dist/BUILD_INFO.txt
          echo "   Release 资产：tailscaled_mipsle.tar.gz / repo-snapshot.tar.gz / bootstrap.sh / BUILD_INFO.txt"

          {
            echo "#### 在 VPS 上发布（一条命令，不需要密钥）"
            echo
            echo '```sh'
            echo "REPO=Kirinni/ts-plan TAG=${REL:-latest} OUT=/srv/ts \\"
            case "$BASE" in
              "" | *CHANGE_ME_TOKEN*) echo "  BASE_URL=<你的分发点> \\" ;;
              *) echo "  BASE_URL=$BASE \\" ;;
            esac
            echo "  LOGIN_SERVER=$TS_LOGIN_SERVER ADVERTISE_ROUTES=$TS_ADVERTISE_ROUTES \\"
            echo "  bash server/pull-release.sh"
            echo '```'
            echo
            echo "#### 路由器安装命令（VPS 铺好之后）"
            echo
            echo '```'
            cat dist/INSTALL.txt
            echo '```'
            echo
            echo "- 工件：\`tailscaled_${VER}_mipsle.tar.gz\`（sha256 \`$tsha\`）"
            echo "- 快照：\`archive/$REF.tar.gz\`（sha256 \`$asha\`）"
            if [ -z "${REL:-}" ]; then
              echo "- ⚠️ 本次没发 Release（既不是 tag 触发、也没填 release tag）→ VPS 上就只能用 Artifacts 里的 zip 手动传"
            fi
            echo
            echo "> 公开仓库的 run 日志/Summary 谁都能看，而上面那条 URL 里带着你的分发点地址。"
            echo "> 介意的话就把分发点当公开地址看（它本来也只是挡爬虫，不是密钥）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传工件（保留 90 天，可当历史版本回滚）
        uses: actions/upload-artifact@v7
        with:
          name: ts-artifact-mipsle-${{ steps.pick.outputs.ver }}
          path: dist/**
          if-no-files-found: error

      - name: 发 Release（固定文件名 + 版本名，供 VPS 匿名拉取）
        if: steps.pick.outputs.rel != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ steps.pick.outputs.rel }}
          VER: ${{ steps.pick.outputs.ver }}
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          set -euo pipefail
          # 注意：不发 INSTALL.txt —— 它含着你的分发点地址（可能带随机 token），
          # 而公开仓库的 Release 资产是谁都能下的。
          set -- \
            dist/tailscaled_mipsle.tar.gz dist/tailscaled_mipsle.tar.gz.sha256 \
            "dist/tailscaled_${VER}_mipsle.tar.gz" "dist/tailscaled_${VER}_mipsle.tar.gz.sha256" \
            dist/repo-snapshot.tar.gz dist/repo-snapshot.tar.gz.sha256 \
            "dist/archive/$REF.tar.gz" dist/bootstrap.sh dist/BUILD_INFO.txt
          if gh release view "$REL" >/dev/null 2>&1; then
            gh release upload "$REL" --clobber "$@"
          else
            gh release create "$REL" --target "$GITHUB_SHA" --generate-notes \
              --title "mipsle 单二进制 $REL（Tailscale $VER）" "$@"
          fi
          echo "- 已发 Release \`$REL\`（VPS 上：TAG=$REL bash server/pull-release.sh）" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 到这里就结束了：产物在 Actions Artifacts（90 天）和 Release 里。
      # 往 VPS 铺的活儿交给 server/pull-release.sh —— 它由 VPS 主动拉，
      # 于是 GitHub 侧不需要持有任何能登你服务器的凭据。
      # ---------------------------------------------------------------------
