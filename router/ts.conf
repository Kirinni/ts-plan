# /etc/tailscale/ts.conf
# 被 /etc/init.d/tailscale-ram 与 /usr/sbin/ts-fetch 载入。
# 只写 POSIX sh 语法（路由器上是 busybox ash），不要用 bash 专有写法。

# ---------------------------------------------------------------------------
# 工件列表：每行 "<sha256> <url>"，按顺序尝试。
# 每个条目必须"下载成功 + sha256 匹配 + 解包成功 + 自检通过"才会被采用，
# 否则自动回退到下一个条目。
#
# 三种来源实测对比（mipsel，2026-09）：
#   ① 自编译单二进制（推荐，见 server/build-selfbuild.sh）
#        30.5MB / gzip 9.9MB，自带 CLI，Soft float + 静态
#   ② 官方静态包（SOURCE=official）
#        tailscaled 38.7MB（gzip 17.7MB）但不含 CLI，还得再配 32.1MB 的 CLI
#   ③ OpenWrt ipk（SOURCE=openwrt）
#        单二进制自带 CLI，但 24.10 分支只有 1.80.3
#        另：snapshots 已改用 apk（ADB 容器），常规工具拆不了
# ---------------------------------------------------------------------------
TS_ARTIFACTS="
PUT_SHA256_HERE https://dl.example.com/ts/CHANGE_ME_TOKEN/tailscaled_1.102.4_mipsle.tar.gz
"

# 只有 TS_ARTIFACTS 放"官方静态包"（它不含 CLI）时才需要填这里：
# ts-login 首次注册时才会拉取，用完立即删除以换回内存。
# 自编译单二进制 / OpenWrt ipk 都自带 CLI → 留空。
TS_CLI_ARTIFACTS=""

# ---------------------------------------------------------------------------
# 路径：二进制/socket 放 tmpfs（重启即失效，开机重下）；
#       state 必须放 overlay，否则每次开机都会在 headscale 里新建一个节点。
# ---------------------------------------------------------------------------
TS_DIR=/tmp/tailscale
STATE_DIR=/etc/tailscale
SOCKET=/tmp/tailscale/tailscaled.sock

# ---------------------------------------------------------------------------
# headscale 接入参数
# ---------------------------------------------------------------------------
LOGIN_SERVER=https://hs.example.com
AUTHKEY_FILE=/etc/tailscale/authkey
HOSTNAME_OVERRIDE=r4a-home
ADVERTISE_ROUTES=192.168.31.0/24
# --accept-dns=false：路由器自己跑 dnsmasq，不让 tailscale 抢上游 DNS
# --snat-subnet-routes=true：默认行为，家里设备无需配置静态路由
UP_EXTRA="--accept-routes=false --accept-dns=false --snat-subnet-routes=true"

# ---------------------------------------------------------------------------
# 下载行为
# ---------------------------------------------------------------------------
# 只抬高 tmpfs 上限、不预分配内存（上限本身不占内存）。
# 96m 是为"官方静态包"准备的：首装要同时放下 daemon 38.7MB + CLI 解包 32.1MB + CLI 包 14.3MB。
# 自编译单二进制只需 30.5MB，改成 48m 也行，留 96m 无害。
TMPFS_SIZE=96m
MAX_ATTEMPTS=20
RETRY_DELAY=15
